name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MIX_ENV: test
      ERL_FLAGS: "+S 2:2"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: "27.3.4.19"
          elixir-version: "1.20.5"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Install pinned local tools and locked dependencies
        run: |
          bin/run rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
          bin/run mix local.hex --force
          bin/run mix local.rebar --force
          bin/run mix deps.get --check-locked
          npm --prefix interop ci --cache .npm-cache --ignore-scripts --no-audit --no-fund
      - name: Check formatting and native code
        run: |
          bin/run mix format --check-formatted
          bin/run cargo fmt --manifest-path native/tensorcash_nif/Cargo.toml --check
          bin/run cargo clippy --manifest-path native/tensorcash_nif/Cargo.toml --locked --all-targets --no-deps -- -D warnings
          bin/run cargo test --manifest-path native/tensorcash_nif/Cargo.toml --locked --lib
      - name: Build and test real NIF and independent official oracle
        run: |
          bin/run mix compile --warnings-as-errors
          bin/run mix test --warnings-as-errors
          npm --prefix interop run check
          bin/run mix run --no-compile bench/run.exs
          npm --prefix interop run --silent crossverify < interop/native.local.json
          bin/run mix run --no-compile bench/reload.exs
      - name: Audit locked dependencies
        run: |
          bin/run mix hex.audit
          bin/run cargo install cargo-audit --version 0.22.2 --locked
          bin/run cargo audit --file native/tensorcash_nif/Cargo.lock
