name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux x86-64 / release NIF
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      MIX_ENV: test
      ERL_FLAGS: "+S 2:2"
      RUSTUP_HOME: ${{ github.workspace }}/.rustup
      CARGO_HOME: ${{ github.workspace }}/.cargo-cache
      HEX_HOME: ${{ github.workspace }}/.hex-cache
      MIX_HOME: ${{ github.workspace }}/.mix
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out repository and pinned official submodule
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up OTP and Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: "27.3.4.19"
          elixir-version: "1.20.5"
          version-type: strict
          install-hex: false
          install-rebar: false

      - name: Install pinned Rust toolchain in project-local rustup home
        run: |
          bin/run rustup toolchain install 1.96.0 --profile minimal --component rustfmt,clippy
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - name: Install Hex, Rebar, and locked Elixir dependencies
        run: |
          bin/run mix local.hex --force
          bin/run mix local.rebar --force
          bin/run mix deps.get --check-locked

      - name: Check Elixir formatting
        run: bin/run mix format --check-formatted

      - name: Check Rust formatting
        run: bin/run cargo fmt --manifest-path native/parano1d_nif/Cargo.toml --check

      - name: Lint Rust with warnings as errors
        run: bin/run cargo clippy --manifest-path native/parano1d_nif/Cargo.toml --locked --all-targets --no-deps -- -D warnings

      - name: Run Rust library gate tests
        run: bin/run cargo test --manifest-path native/parano1d_nif/Cargo.toml --locked --lib

      # Native uses Rustler mode :release in every Mix environment.
      - name: Compile release NIF with Elixir warnings as errors
        run: bin/run mix compile --warnings-as-errors

      - name: Run real NIF tests with two normal schedulers
        run: bin/run mix test --warnings-as-errors

      - name: Audit locked Hex dependencies
        run: bin/run mix hex.audit

      - name: Install pinned RustSec audit CLI
        run: bin/run cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit locked Rust dependencies
        run: bin/run cargo audit --file native/parano1d_nif/Cargo.lock
