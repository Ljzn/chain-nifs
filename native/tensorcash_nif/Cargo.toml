[package]
name = "tensorcash_nif"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
rustler = "=0.37.2"
sha2 = { version = "=0.11.0", features = ["zeroize"] }
secp256k1 = "0.31"
bech32 = "0.9"
hex = "0.4"
zeroize = "1.8"
getrandom = "0.2"

[build-dependencies]
cmake = "0.1"
cc = "1.2"

[dev-dependencies]
serde_json = "1.0"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"
