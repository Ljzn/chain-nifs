[package]
name = "blocknet_nif"
version = "0.1.0"
edition = "2021"
[lib]
name = "blocknet_nif"
crate-type = ["cdylib"]
[dependencies]
rustler = "=0.37.2"
curve25519-dalek = { version = "4.1", features = ["rand_core", "digest", "zeroize"] }
bulletproofs = "5.0"
merlin = "3.0"
rand = "0.8"
rand_core = "0.6"
getrandom = "0.2"
sha2 = "0.10"
sha3 = "0.10"
zeroize = "1.8"
hex = "0.4"
[dev-dependencies]
serde_json = "1.0"
[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"
